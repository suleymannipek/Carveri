<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Carveri Trip & HUD</title>
  <meta name="theme-color" content="#070d1e" />
  <link rel="manifest" href="./manifest.json" />

  <script src="../libs/tailwind.js"></script>
  <script src="../libs/jszip.min.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {});
      });
    }
  </script>

  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    html, body {
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
      background-color: #070d1e;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .hud-box {
      background: linear-gradient(135deg, rgba(17, 28, 56, 0.85) 0%, rgba(10, 18, 38, 0.95) 100%);
      border: 1px solid rgba(30, 44, 79, 0.9);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .neon-dial {
      box-shadow: inset 0 0 25px rgba(6, 182, 212, 0.2), 0 0 30px rgba(6, 182, 212, 0.12);
    }
  </style>
</head>
<body class="flex flex-col justify-between p-3 max-w-md mx-auto pt-[calc(0.5rem+var(--sat))] pb-[calc(0.5rem+var(--sab))]">

  <!-- 1. ÜST PANEL: GERİ, PROFİL VE ZIP -->
  <header class="hud-box rounded-2xl p-2.5 flex justify-between items-center shrink-0">
    <div class="flex items-center gap-2 min-w-0">
      <a href="../index.html" class="w-8 h-8 rounded-xl bg-slate-800/80 border border-slate-700/60 flex items-center justify-center text-xs text-cyan-400 hover:text-white transition-all shrink-0">◀</a>
      <div class="min-w-0 truncate">
        <div class="flex items-center gap-1.5">
          <span class="text-xs font-black text-cyan-400 tracking-wider">CARVERİ</span>
          <span class="text-[9px] bg-cyan-500/20 text-cyan-300 font-black px-1.5 py-0.5 rounded border border-cyan-500/30">HUD</span>
        </div>
        <p id="carDescHeader" class="text-[10px] text-slate-400 font-semibold truncate">Bağlanıyor...</p>
      </div>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <span id="gpsStatusBadge" class="text-[9px] font-black px-2 py-1 rounded-lg bg-emerald-950 text-emerald-400 border border-emerald-800/60">GPS Ready 🟢</span>
      <label class="cursor-pointer bg-slate-800/60 hover:bg-slate-700/80 p-2 rounded-xl text-xs text-cyan-300 border border-slate-700/60" title="ZIP Yedeği Oku">
        <span>📦</span>
        <input type="file" accept=".zip" onchange="loadZipBackup(event)" class="hidden" />
      </label>
    </div>
  </header>

  <!-- 2. HEDEF TARİF VE GOOGLE MAPS KÖPRÜSÜ -->
  <div class="hud-box rounded-2xl p-1.5 shrink-0 my-1 border-slate-700/50">
    <div class="flex gap-1.5 items-center">
      <div class="pl-2 text-slate-400 text-xs">🔍</div>
      <input type="text" id="targetNavInput" placeholder="Nereye gideceksiniz? (örn: Ankara AŞTİ)" class="flex-1 bg-transparent text-xs px-1 text-white outline-none font-medium placeholder-slate-500" />
      <button onclick="launchExternalNav()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 text-[11px] font-black px-3.5 py-1.5 rounded-xl shadow transition-transform active:scale-95 shrink-0">
        Tarif
      </button>
    </div>
  </div>

  <!-- 3. ANA DİJİTAL KADRAN (HUD HIZ GÖSTERGESİ) -->
  <main class="flex-1 flex flex-col justify-around my-0.5 min-h-0 space-y-2">
    <div class="hud-box rounded-3xl p-3 text-center neon-border relative flex flex-col justify-center items-center flex-1 min-h-[130px] border-cyan-500/30">
      
      <!-- Arka plan dijital yay efekti -->
      <div class="absolute inset-x-4 top-2 flex justify-between px-6 opacity-30 pointer-events-none">
        <span class="text-[9px] font-bold text-cyan-400">0</span>
        <span class="text-[9px] font-bold text-cyan-400">60</span>
        <span class="text-[9px] font-bold text-cyan-400">120</span>
        <span class="text-[9px] font-bold text-cyan-400">180+</span>
      </div>

      <span class="text-[9px] uppercase font-black tracking-widest text-slate-400 mt-1">ANLIK HIZ</span>
      
      <div class="flex items-baseline justify-center gap-1 my-0">
        <span id="liveSpeedText" class="text-7xl font-black text-cyan-400 tracking-tighter drop-shadow-[0_0_25px_rgba(6,182,212,0.5)]">0</span>
        <span class="text-xs font-black text-slate-400 uppercase">km/s</span>
      </div>

      <p id="accuracyText" class="text-[9px] text-slate-400 font-medium">Doğruluk: ±0m</p>
    </div>

    <!-- 4. ROTA VE MALİYET KARTLARI (YATAY İKİ SÜTUN) -->
    <div class="grid grid-cols-2 gap-2.5 shrink-0">
      <!-- Rota Kartı -->
      <div class="hud-box rounded-2xl p-2.5 border-blue-500/30 text-center relative overflow-hidden">
        <span class="text-[9px] font-black uppercase text-blue-400 block tracking-wider">BU ROTA (TRIP)</span>
        <div class="flex items-baseline justify-center gap-0.5 mt-0.5">
          <span id="tripDistanceText" class="text-2xl font-black text-slate-100">0.0</span>
          <span class="text-[10px] text-blue-400 font-black">KM</span>
        </div>
        <p id="tripTimeText" class="text-[9px] text-slate-400 font-semibold mt-0.5">Süre: 00:00</p>
      </div>

      <!-- Harcanan Bedel Kartı -->
      <div class="hud-box rounded-2xl p-2.5 border-amber-500/30 text-center relative overflow-hidden">
        <span class="text-[9px] font-black uppercase text-amber-500 block tracking-wider">HARCANAN BEDEL</span>
        <div class="flex items-baseline justify-center gap-0.5 mt-0.5">
          <span class="text-xs font-black text-amber-500">₺</span>
          <span id="tripCostText" class="text-2xl font-black text-amber-400">0</span>
        </div>
        <p id="tripLitersText" class="text-[9px] text-slate-400 font-semibold mt-0.5">0.00 L tüketildi</p>
      </div>
    </div>

    <!-- Rota İsmi ve Tüketim Bilgi Satırı -->
    <div class="hud-box rounded-2xl p-2.5 shrink-0 space-y-1.5 border-slate-700/60">
      <div class="flex justify-between items-center text-[9px] px-1">
        <span class="font-bold text-slate-400">Rota İsmi</span>
        <span id="autoParamsBadge" class="text-cyan-400 font-bold">Tüketim: 6.5 L • Fiyat: 0.00 ₺</span>
      </div>
      <input type="text" id="routeNameInput" placeholder="örn: Şehir İçi / Eskişehir - Bursa" class="w-full bg-slate-900/80 border border-slate-700/60 text-xs px-2.5 py-2 rounded-xl text-white outline-none font-bold" />
    </div>
  </main>

  <!-- 5. ALT KONTROL BUTONLARI -->
  <footer class="shrink-0 pt-1">
    <div id="btnGroupStart">
      <button onclick="startTripTracking()" class="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 text-white font-black text-xs rounded-2xl shadow-lg flex items-center justify-center gap-2 active:scale-98 transition-all">
        <span>🚀</span> Rotayı Başlat & Takip Et
      </button>
    </div>

    <div id="btnGroupStop" class="grid grid-cols-2 gap-2.5 hidden">
      <button onclick="cancelTripTracking()" class="py-2.5 bg-rose-950/80 hover:bg-rose-900 text-rose-300 font-bold text-xs rounded-xl border border-rose-800/60 shadow">
        İptal Et
      </button>
      <button onclick="promptFinishRoute()" class="py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-black text-xs rounded-xl shadow-lg active:scale-98 transition-all">
        Rotayı Bitir & Kaydet
      </button>
    </div>
  </footer>

  <script>
    const STORAGE_PREFIX = "ototakip_promax_";
    let fullBackupData = null;

    let avgConsumption = 6.5; 
    let unitFuelPrice = 45.0;  

    let isTracking = false;
    let watchId = null;
    let startTime = null;
    let timerInterval = null;
    let totalDistanceKm = 0;
    let lastCoords = null;
    let wakeLock = null;

    function syncFromCarveriStorage() {
      try {
        const rawProfile = localStorage.getItem(STORAGE_PREFIX + "profile");
        if (rawProfile) {
          const p = JSON.parse(rawProfile);
          document.getElementById("carDescHeader").innerText = `${p.name || 'Carveri'} (${p.desc || 'Model'})`;
        } else {
          document.getElementById("carDescHeader").innerText = "Carveri (Bağlandı)";
        }

        const rawOdo = localStorage.getItem(STORAGE_PREFIX + "odologs");
        if (rawOdo) {
          const odos = JSON.parse(rawOdo);
          const valid = odos.filter(o => o.dashboardL100 > 0);
          if (valid.length > 0) {
            avgConsumption = parseFloat(valid[valid.length - 1].dashboardL100) || avgConsumption;
          }
        }

        const rawPrices = localStorage.getItem(STORAGE_PREFIX + "live_fuel_prices");
        if (rawPrices) {
          const lp = JSON.parse(rawPrices);
          if (lp.fiyatlar) {
            const pObj = rawProfile ? JSON.parse(rawProfile) : {};
            const fType = pObj.fuelType || "benzin";
            const priceStr = lp.fiyatlar[fType] || lp.fiyatlar.benzin;
            if (priceStr) unitFuelPrice = parseFloat(String(priceStr).replace(",", ".")) || unitFuelPrice;
          }
        }

        document.getElementById("autoParamsBadge").innerText = `Tüketim: ${avgConsumption.toFixed(1)} L • Fiyat: ${unitFuelPrice.toFixed(2)} ₺`;
      } catch (e) {}
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
    }

    async function loadZipBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      try {
        const zip = await JSZip.loadAsync(file);
        const jsonFile = zip.file("veriler.json");
        if (!jsonFile) return alert("Geçersiz yedek: veriler.json bulunamadı.");

        const text = await jsonFile.async("text");
        fullBackupData = JSON.parse(text);

        if (fullBackupData.profile) {
          document.getElementById("carDescHeader").innerText = `${fullBackupData.profile.name} • ${fullBackupData.profile.desc || ''}`;
        }
        if (Array.isArray(fullBackupData.odoLogs)) {
          const validOdos = fullBackupData.odoLogs.filter(o => o.dashboardL100 > 0);
          if (validOdos.length > 0) avgConsumption = validOdos[validOdos.length - 1].dashboardL100;
        }

        document.getElementById("autoParamsBadge").innerText = `Tüketim: ${avgConsumption.toFixed(1)} L • Fiyat: ${unitFuelPrice.toFixed(2)} ₺`;
        alert("✓ Carveri Pro ZIP verileri başarıyla yüklendi!");
      } catch (err) {
        alert("Yedek okuma hatası: " + err.message);
      }
    }

    function launchExternalNav() {
      const target = document.getElementById("targetNavInput").value.trim();
      if (!target) return alert("Lütfen gitmek istediğiniz konumu yazın.");
      const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(target)}`;
      window.open(mapsUrl, "_blank");
    }

    function getDistanceBetweenPoints(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function initPassiveGps() {
      if (!navigator.geolocation) {
        document.getElementById("gpsStatusBadge").innerText = "GPS Yok ❌";
        return;
      }

      document.getElementById("gpsStatusBadge").innerText = "Uydu Aranıyor 📡";
      document.getElementById("gpsStatusBadge").className = "text-[9px] font-black px-2 py-1 rounded-lg bg-amber-950 text-amber-400 border border-amber-800/60";

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude, longitude, speed, accuracy } = pos.coords;
          document.getElementById("accuracyText").innerText = `Doğruluk: ±${Math.round(accuracy)}m`;

          if (!isTracking) {
            document.getElementById("gpsStatusBadge").innerText = "GPS Hazır 🟢";
            document.getElementById("gpsStatusBadge").className = "text-[9px] font-black px-2 py-1 rounded-lg bg-emerald-950 text-emerald-400 border border-emerald-800/60";
          }

          const kmh = speed !== null && speed > 0 ? Math.round(speed * 3.6) : 0;
          document.getElementById("liveSpeedText").innerText = kmh;

          if (isTracking) {
            if (lastCoords) {
              const stepDist = getDistanceBetweenPoints(lastCoords.lat, lastCoords.lon, latitude, longitude);
              if (stepDist > 0.005 && stepDist < 2.0 && accuracy < 40) {
                totalDistanceKm += stepDist;
              }
            }
            lastCoords = { lat: latitude, lon: longitude };
            document.getElementById("tripDistanceText").innerText = totalDistanceKm.toFixed(1);

            const burnedLiters = (totalDistanceKm * avgConsumption) / 100;
            const cost = Math.round(burnedLiters * unitFuelPrice);
            document.getElementById("tripLitersText").innerText = `${burnedLiters.toFixed(2)} L tüketildi`;
            document.getElementById("tripCostText").innerText = cost.toLocaleString('tr-TR');
          }
        },
        (err) => {
          document.getElementById("gpsStatusBadge").innerText = "Sinyal Yok ⚠️";
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
      );
    }

    function startTripTracking() {
      totalDistanceKm = 0;
      lastCoords = null;
      startTime = Date.now();
      isTracking = true;

      requestWakeLock();

      document.getElementById("btnGroupStart").classList.add("hidden");
      document.getElementById("btnGroupStop").classList.remove("hidden");
      document.getElementById("gpsStatusBadge").innerText = "Kayıt 🔴";
      document.getElementById("gpsStatusBadge").className = "text-[9px] font-black px-2 py-1 rounded-lg bg-rose-950 text-rose-400 border border-rose-800/60 animate-pulse";

      timerInterval = setInterval(() => {
        const sec = Math.floor((Date.now() - startTime) / 1000);
        const m = String(Math.floor(sec / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        document.getElementById("tripTimeText").innerText = `Süre: ${m}:${s}`;
      }, 1000);
    }

    function cancelTripTracking() {
      if (!confirm("Bu rota kaydını iptal etmek ve silmek istediğinize emin misiniz?")) return;
      stopGpsWatch();
      resetDisplay();
      initPassiveGps();
    }

    function promptFinishRoute() {
      stopGpsWatch();

      let defaultName = document.getElementById("routeNameInput").value.trim() || "Uzun Yol Rotası";
      let measuredKm = parseFloat(totalDistanceKm.toFixed(1));

      const rName = prompt("🧭 Rota Adı / Güzergah:", defaultName);
      if (rName === null) { startTripTracking(); return; }

      const distStr = prompt(
        `🛣️ GPS ile Ölçülen Mesafe: ${measuredKm} KM\nTrip sayacıyla eşitlemek isterseniz değiştirebilirsiniz:`, 
        measuredKm
      );
      if (distStr === null) { startTripTracking(); return; }

      const consStr = prompt(
        `📊 Yolculuk Sonu Gösterge Tüketimi (L/100km):`, 
        avgConsumption.toFixed(1)
      );
      if (consStr === null) { startTripTracking(); return; }

      const finalKm = parseFloat(distStr) || measuredKm;
      const finalCons = parseFloat(consStr) || avgConsumption;
      const finalLiters = parseFloat(((finalKm * finalCons) / 100).toFixed(2));
      const finalCost = Math.round(finalLiters * unitFuelPrice);

      const newRoute = {
        id: "route_" + Date.now(),
        name: rName.trim() || defaultName,
        date: new Date().toISOString(),
        distance: finalKm,
        consumption: finalCons.toFixed(2),
        liters: finalLiters
      };

      let savedToStorage = false;
      try {
        let routes = [];
        const raw = localStorage.getItem(STORAGE_PREFIX + "completed_routes");
        if (raw) routes = JSON.parse(raw);
        routes.push(newRoute);
        localStorage.setItem(STORAGE_PREFIX + "completed_routes", JSON.stringify(routes));
        savedToStorage = true;
      } catch (e) {}

      if (fullBackupData) {
        if (!Array.isArray(fullBackupData.completedRoutes)) fullBackupData.completedRoutes = [];
        fullBackupData.completedRoutes.push(newRoute);
        exportUpdatedZip();
      }

      alert(
        `✅ ROTA HESAPLANDI & KAYDEDİLDİ!\n` +
        `----------------------------------------\n` +
        `🧭 Güzergah: ${newRoute.name}\n` +
        `🛣️ Mesafe: ${finalKm} KM\n` +
        `📊 Gösterge: ${finalCons.toFixed(2)} L/100km\n` +
        `💧 Harcanan: ${finalLiters} L (~${finalCost.toLocaleString('tr-TR')} ₺)\n\n` +
        (savedToStorage ? "✓ Ana Carveri Pro'ya aktarıldı!" : "")
      );

      resetDisplay();
      initPassiveGps();
    }

    async function exportUpdatedZip() {
      try {
        const zip = new JSZip();
        zip.file("veriler.json", JSON.stringify(fullBackupData, null, 2));
        const blob = await zip.generateAsync({ type: "blob" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `Carveri_Yedek_${new Date().toISOString().split("T")[0]}.zip`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch (e) {}
    }

    function stopGpsWatch() {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      if (timerInterval) clearInterval(timerInterval);
      releaseWakeLock();
      isTracking = false;
    }

    function resetDisplay() {
      document.getElementById("btnGroupStart").classList.remove("hidden");
      document.getElementById("btnGroupStop").classList.add("hidden");
      document.getElementById("tripDistanceText").innerText = "0.0";
      document.getElementById("tripCostText").innerText = "0";
      document.getElementById("tripLitersText").innerText = "0.00 L tüketildi";
      document.getElementById("tripTimeText").innerText = "Süre: 00:00";
      document.getElementById("targetNavInput").value = "";
      document.getElementById("routeNameInput").value = "";
    }

    window.addEventListener("DOMContentLoaded", () => {
      syncFromCarveriStorage();
      initPassiveGps();
    });
  </script>
</body>
</html>
