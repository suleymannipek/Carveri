<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Carveri Trip & HUD - Premium OLED</title>
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="./manifest.json" />

  <script src="../libs/tailwind.js"></script>
  <script src="../libs/jszip.min.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {});
      });
    }
  </script>

  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    
    /* TEMALAR */
    body.theme-copper {
      --color-accent: #d97706; 
      --color-glow: rgba(217, 119, 6, 0.4);
      --bg-accent: rgba(217, 119, 6, 0.1);
    }
    body.theme-cyan {
      --color-accent: #06b6d4;
      --color-glow: rgba(6, 182, 212, 0.4);
      --bg-accent: rgba(6, 182, 212, 0.1);
    }
    body.theme-emerald {
      --color-accent: #10b981;
      --color-glow: rgba(16, 185, 129, 0.4);
      --bg-accent: rgba(16, 185, 129, 0.1);
    }

    html, body {
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      background-color: #000000; /* Saf OLED Siyahı */
    }

    /* Cam Efektli Kartlar (Glassmorphism) */
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .accent-text { color: var(--color-accent); }
    .accent-border { border-color: var(--color-accent); }
    .accent-bg { background-color: var(--color-accent); }
    .glow-text { text-shadow: 0 0 25px var(--color-glow); }

    /* --- ÖZEL START BUTONU TASARIMI --- */
    .btn-engine-start {
      background: linear-gradient(135deg, #065f46 0%, #10b981 100%);
      border: 2px solid #34d399;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.3), inset 0 2px 5px rgba(255,255,255,0.4);
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      transition: all 0.1s ease-out;
    }
    .btn-engine-start:active {
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.5), inset 0 4px 10px rgba(0,0,0,0.7);
      transform: translateY(3px) scale(0.97);
    }

    /* --- RESPONSIVE YAPI (TELEFON & CARLINKIT) --- */
    .live-speed-val {
      font-size: clamp(90px, 25vw, 130px);
      line-height: 0.9;
    }
    .content-wrapper {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0; /* Flex hatasını engeller */
      margin-top: 0.5rem;
    }
    
    .controls-panel {
      overflow-y: auto; /* Basık ekranlarda kaydırma açar */
      scrollbar-width: none; /* Firefox için gizler */
    }
    .controls-panel::-webkit-scrollbar { display: none; } /* Chrome için gizler */

    /* Cihaz Yan Döndüğünde (Carlinkit & Tablet) */
    @media (orientation: landscape) and (min-width: 500px) {
      .live-speed-val { 
        font-size: clamp(80px, 35vh, 160px); /* Yüksekliğe göre akıllı boyut */
      }
      .content-wrapper {
        flex-direction: row;
        align-items: stretch;
        gap: 1.5rem;
      }
      .main-speed {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        border-right: 1px solid rgba(255,255,255,0.08);
      }
      .controls-panel {
        flex: 1;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-right: 0.5rem;
      }
    }
  </style>
</head>
<body class="theme-copper text-white h-[100dvh] w-full overflow-hidden font-sans pt-[calc(0.5rem+var(--sat))] pb-[calc(0.5rem+var(--sab))] px-4 flex flex-col">

  <!-- 1. ÜST BİLGİ BARI -->
  <header class="shrink-0 flex justify-between items-center py-2 border-b border-white/5 pb-3">
    <div class="flex items-center gap-3">
      <a href="../index.html" class="w-10 h-10 rounded-full glass-card flex items-center justify-center text-zinc-400 hover:text-white transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
      </a>
      <div>
        <h1 class="text-[13px] font-black tracking-widest text-zinc-300">CARVERI <span class="accent-text">HUD</span></h1>
        <p id="carDescHeader" class="text-[10px] text-zinc-500 truncate w-32">Bağlanıyor...</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="cycleTheme()" class="text-xl bg-white/5 w-10 h-10 rounded-full flex items-center justify-center hover:bg-white/10 transition-colors" title="Temayı Değiştir">🎨</button>
      <div class="flex flex-col items-end">
        <span id="gpsStatusBadge" class="text-[9px] font-bold px-2 py-1 rounded-full glass-card accent-text">GPS Aranıyor</span>
        <label class="text-[9px] text-zinc-500 mt-1 cursor-pointer hover:text-zinc-300 transition-colors">📦 Yükle
          <input type="file" accept=".zip" onchange="loadZipBackup(event)" class="hidden" />
        </label>
      </div>
    </div>
  </header>

  <!-- 2. ANA İÇERİK ALANI (Akıllı Esnek Yapı) -->
  <div class="content-wrapper">
    
    <!-- Hız Göstergesi Bölümü -->
    <main class="main-speed flex-1 flex flex-col items-center justify-center relative">
      <span class="text-[10px] font-black accent-text tracking-[0.3em] uppercase mb-2">ANLIK HIZ</span>
      <div class="flex items-baseline gap-2">
        <span id="liveSpeedText" class="live-speed-val font-black tracking-tighter tabular-nums text-white glow-text">0</span>
        <span class="text-xl font-bold text-zinc-600">km/s</span>
      </div>
      <p id="accuracyText" class="text-[11px] text-zinc-600 mt-3 font-medium">±0m Doğruluk</p>
    </main>

    <!-- Veri Kartları ve Butonlar Bölümü (Taşma durumunda kaydırılabilir) -->
    <section class="controls-panel shrink-0 space-y-3.5 w-full mx-auto pb-4">
      
      <!-- Rota Adı ve Harita -->
      <div class="flex gap-2 pt-2">
        <input type="text" id="routeNameInput" placeholder="Nereye Gidiyoruz? (Rota Adı)" class="flex-1 glass-card rounded-2xl px-4 py-3.5 text-xs text-white placeholder-zinc-600 focus:accent-border outline-none transition-colors" />
        <button onclick="launchExternalNav()" class="glass-card hover:bg-white/10 text-zinc-300 px-4 rounded-2xl text-[11px] font-bold flex items-center justify-center transition-colors shadow-lg">🗺️ Harita</button>
      </div>

      <!-- Tüketim ve Mesafe Kartları -->
      <div class="grid grid-cols-2 gap-3">
        <div class="glass-card rounded-2xl p-4 flex flex-col justify-center relative overflow-hidden">
          <div class="absolute top-0 left-0 w-full h-1 accent-bg opacity-50"></div>
          <span class="text-[9px] uppercase text-zinc-500 font-bold tracking-wider">MESAFE / SÜRE</span>
          <div class="flex items-baseline gap-1 mt-1.5">
            <span id="tripDistanceText" class="text-3xl font-black tabular-nums text-white">0.0</span>
            <span class="text-[10px] text-zinc-400">KM</span>
          </div>
          <p id="tripTimeText" class="text-[11px] accent-text mt-1 font-mono font-bold">00:00</p>
        </div>
        
        <div class="glass-card rounded-2xl p-4 flex flex-col justify-center relative overflow-hidden">
          <div class="absolute top-0 left-0 w-full h-1 bg-zinc-700 opacity-50"></div>
          <span class="text-[9px] uppercase text-zinc-500 font-bold tracking-wider">YAKIT MALİYETİ</span>
          <div class="flex items-baseline gap-1 mt-1.5">
            <span class="text-[11px] text-zinc-400">₺</span>
            <span id="tripCostText" class="text-3xl font-black text-white tabular-nums">0</span>
          </div>
          <p id="tripLitersText" class="text-[10px] text-zinc-500 mt-1">0.00 L tüketildi</p>
        </div>
      </div>
      <div id="autoParamsBadge" class="text-[9px] text-zinc-600 text-center font-medium bg-white/5 rounded-lg py-1.5 mx-8">Tüketim Yükleniyor...</div>

      <!-- KİBAR "BAŞLAT" BUTONU -->
      <div id="btnGroupStart" class="pt-2 pb-2">
        <button onclick="startTripTracking()" class="w-full py-3.5 rounded-2xl btn-engine-start text-white flex items-center justify-center gap-2">
          <span class="text-sm font-black tracking-widest uppercase text-white drop-shadow-md">🚀 Sürüşü Başlat</span>
        </button>
      </div>
      
      <!-- İPTAL / BİTİR BUTONLARI -->
      <div id="btnGroupStop" class="grid grid-cols-3 gap-2 hidden pt-2 pb-2">
        <button onclick="cancelTripTracking()" class="col-span-1 py-4 glass-card text-rose-400 font-bold text-xs rounded-2xl active:scale-95 transition-all">İptal</button>
        <button onclick="openFinishModal()" class="col-span-2 py-4 accent-bg text-black font-black text-xs uppercase tracking-widest rounded-2xl active:scale-95 transition-all glow-text" style="text-shadow: none;">
          ⏹️ BİTİR & KAYDET
        </button>
      </div>
    </section>
  </div>

  <!-- 3. SÜRÜŞ BİTİŞ EKRANI (MODAL) -->
  <div id="finishModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center hidden transition-opacity p-4">
    <div class="glass-card w-full max-w-md rounded-3xl p-6 shadow-[0_10px_40px_rgba(0,0,0,0.8)] border-t border-white/20">
      <h3 class="accent-text font-black text-lg mb-5 uppercase tracking-wider text-center">🏁 SÜRÜŞ ÖZETİ</h3>
      <div class="space-y-4">
        <div>
          <label class="text-[10px] text-zinc-400 uppercase font-bold tracking-widest">Rota Adı</label>
          <input type="text" id="modalRouteName" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3.5 text-sm text-white mt-1.5 focus:accent-border outline-none transition-colors" />
        </div>
        <div class="flex gap-3">
          <div class="flex-1">
            <label class="text-[10px] text-zinc-400 uppercase font-bold tracking-widest">Ölçülen (KM)</label>
            <input type="number" step="0.1" id="modalDistance" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3.5 text-lg text-white font-black mt-1.5 outline-none focus:accent-border text-center" />
          </div>
          <div class="flex-1">
            <label class="text-[10px] text-zinc-400 uppercase font-bold tracking-widest">Tüketim (L)</label>
            <input type="number" step="0.1" id="modalConsumption" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3.5 text-lg text-white font-black mt-1.5 outline-none focus:accent-border text-center" />
          </div>
        </div>
      </div>
      <div class="flex gap-3 mt-8">
        <button onclick="closeFinishModal()" class="flex-1 py-4 glass-card text-zinc-300 font-bold rounded-xl text-xs uppercase tracking-wider">Vazgeç</button>
        <button onclick="finalizeRouteSave()" class="flex-[1.5] py-4 accent-bg text-black font-black rounded-xl text-xs uppercase tracking-wider shadow-[0_0_15px_var(--color-glow)]">Onayla & Kaydet</button>
      </div>
    </div>
  </div>

  <script>
    // --- 1. TEMA MOTORU ---
    const themes = ['theme-copper', 'theme-cyan', 'theme-emerald'];
    let currentThemeIdx = 0;

    function initTheme() {
      const savedTheme = localStorage.getItem('hud_theme') || 'theme-copper';
      currentThemeIdx = themes.indexOf(savedTheme) !== -1 ? themes.indexOf(savedTheme) : 0;
      document.body.classList.add(savedTheme);
    }

    function cycleTheme() {
      const oldTheme = themes[currentThemeIdx];
      currentThemeIdx = (currentThemeIdx + 1) % themes.length;
      const newTheme = themes[currentThemeIdx];
      
      document.body.classList.remove(oldTheme);
      document.body.classList.add(newTheme);
      localStorage.setItem('hud_theme', newTheme);
    }

    // --- 2. CARVERI ANA JS MANTIKLARI ---
    const STORAGE_PREFIX = "ototakip_promax_";
    let fullBackupData = null;
    let avgConsumption = 6.5; 
    let unitFuelPrice = 45.0;  
    let isTracking = false;
    let watchId = null;
    let startTime = null;
    let timerInterval = null;
    let totalDistanceKm = 0;
    let lastCoords = null;
    let wakeLock = null;

    function syncFromCarveriStorage() {
      try {
        const rawProfile = localStorage.getItem(STORAGE_PREFIX + "profile");
        if (rawProfile) {
          const p = JSON.parse(rawProfile);
          document.getElementById("carDescHeader").innerText = `${p.name || 'Carveri'} (${p.desc || 'Model'})`;
        } else {
          document.getElementById("carDescHeader").innerText = "Carveri (Bağlandı)";
        }

        const rawOdo = localStorage.getItem(STORAGE_PREFIX + "odologs");
        if (rawOdo) {
          const odos = JSON.parse(rawOdo);
          const valid = odos.filter(o => o.dashboardL100 > 0);
          if (valid.length > 0) avgConsumption = parseFloat(valid[valid.length - 1].dashboardL100) || avgConsumption;
        }

        const rawPrices = localStorage.getItem(STORAGE_PREFIX + "live_fuel_prices");
        if (rawPrices) {
          const lp = JSON.parse(rawPrices);
          if (lp.fiyatlar) {
            const pObj = rawProfile ? JSON.parse(rawProfile) : {};
            const fType = pObj.fuelType || "benzin";
            const priceStr = lp.fiyatlar[fType] || lp.fiyatlar.benzin;
            if (priceStr) unitFuelPrice = parseFloat(String(priceStr).replace(",", ".")) || unitFuelPrice;
          }
        }
        document.getElementById("autoParamsBadge").innerText = `Kayıtlı Tüketim: ${avgConsumption.toFixed(1)} L • Fiyat: ${unitFuelPrice.toFixed(2)} ₺`;
      } catch (e) {}
    }

    async function requestWakeLock() {
      try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
    }
    function releaseWakeLock() {
      if (wakeLock !== null) { wakeLock.release().catch(() => {}); wakeLock = null; }
    }

    async function loadZipBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      try {
        const zip = await JSZip.loadAsync(file);
        const jsonFile = zip.file("veriler.json");
        if (!jsonFile) return alert("Geçersiz yedek: veriler.json bulunamadı.");
        const text = await jsonFile.async("text");
        fullBackupData = JSON.parse(text);

        if (fullBackupData.profile) document.getElementById("carDescHeader").innerText = `${fullBackupData.profile.name} • ${fullBackupData.profile.desc || ''}`;
        if (Array.isArray(fullBackupData.odoLogs)) {
          const validOdos = fullBackupData.odoLogs.filter(o => o.dashboardL100 > 0);
          if (validOdos.length > 0) avgConsumption = validOdos[validOdos.length - 1].dashboardL100;
        }

        document.getElementById("autoParamsBadge").innerText = `Kayıtlı Tüketim: ${avgConsumption.toFixed(1)} L • Fiyat: ${unitFuelPrice.toFixed(2)} ₺`;
        alert("✓ Carveri Pro ZIP verileri başarıyla yüklendi!");
      } catch (err) { alert("Yedek okuma hatası: " + err.message); }
    }

    function launchExternalNav() {
      const target = document.getElementById("routeNameInput").value.trim();
      if (!target) return alert("Lütfen Harita'da aratmak için Rota Adı kısmına konumu yazın.");
      const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(target)}`;
      window.open(mapsUrl, "_blank");
    }

    function getDistanceBetweenPoints(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function initPassiveGps() {
      if (!navigator.geolocation) {
        document.getElementById("gpsStatusBadge").innerText = "GPS Yok ❌"; return;
      }
      
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const { latitude, longitude, speed, accuracy } = pos.coords;
          document.getElementById("accuracyText").innerText = `±${Math.round(accuracy)}m Doğruluk`;

          if (!isTracking) {
            document.getElementById("gpsStatusBadge").innerText = "GPS Hazır 🟢";
          }

          const kmh = speed !== null && speed > 0 ? Math.round(speed * 3.6) : 0;
          document.getElementById("liveSpeedText").innerText = kmh;

          if (isTracking) {
            if (lastCoords) {
              const stepDist = getDistanceBetweenPoints(lastCoords.lat, lastCoords.lon, latitude, longitude);
              if (stepDist > 0.005 && stepDist < 2.0 && accuracy < 40) {
                totalDistanceKm += stepDist;
              }
            }
            lastCoords = { lat: latitude, lon: longitude };
            document.getElementById("tripDistanceText").innerText = totalDistanceKm.toFixed(1);

            const burnedLiters = (totalDistanceKm * avgConsumption) / 100;
            const cost = Math.round(burnedLiters * unitFuelPrice);
            document.getElementById("tripLitersText").innerText = `${burnedLiters.toFixed(2)} L tüketildi`;
            document.getElementById("tripCostText").innerText = cost.toLocaleString('tr-TR');
          }
        },
        (err) => { document.getElementById("gpsStatusBadge").innerText = "Sinyal Yok ⚠️"; },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
      );
    }

    function startTripTracking() {
      totalDistanceKm = 0; lastCoords = null; startTime = Date.now(); isTracking = true;
      requestWakeLock();
      document.getElementById("btnGroupStart").classList.add("hidden");
      document.getElementById("btnGroupStop").classList.remove("hidden");
      
      document.getElementById("gpsStatusBadge").innerText = "Kayıt 🔴";
      document.getElementById("gpsStatusBadge").classList.add("animate-pulse");

      timerInterval = setInterval(() => {
        const sec = Math.floor((Date.now() - startTime) / 1000);
        const m = String(Math.floor(sec / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        document.getElementById("tripTimeText").innerText = `${m}:${s}`;
      }, 1000);
    }

    function cancelTripTracking() {
      if (!confirm("Bu rota kaydını iptal etmek istediğinize emin misiniz?")) return;
      stopGpsWatch(); resetDisplay(); initPassiveGps();
    }

    function stopGpsWatch() {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      if (timerInterval) clearInterval(timerInterval);
      releaseWakeLock(); isTracking = false;
    }

    function resetDisplay() {
      document.getElementById("btnGroupStart").classList.remove("hidden");
      document.getElementById("btnGroupStop").classList.add("hidden");
      document.getElementById("tripDistanceText").innerText = "0.0";
      document.getElementById("tripCostText").innerText = "0";
      document.getElementById("tripLitersText").innerText = "0.00 L tüketildi";
      document.getElementById("tripTimeText").innerText = "00:00";
      document.getElementById("routeNameInput").value = "";
      document.getElementById("gpsStatusBadge").classList.remove("animate-pulse");
      document.getElementById("gpsStatusBadge").innerText = "GPS Hazır 🟢";
    }

    // --- 3. MODAL (BİTİRİŞ) YÖNETİMİ ---
    function openFinishModal() {
      stopGpsWatch(); 
      let defaultName = document.getElementById("routeNameInput").value.trim() || "Uzun Yol Rotası";
      document.getElementById("modalRouteName").value = defaultName;
      document.getElementById("modalDistance").value = parseFloat(totalDistanceKm.toFixed(1));
      document.getElementById("modalConsumption").value = avgConsumption.toFixed(1);
      
      document.getElementById("finishModal").classList.remove("hidden");
    }

    function closeFinishModal() {
      document.getElementById("finishModal").classList.add("hidden");
      startTime = Date.now() - (document.getElementById("tripTimeText").innerText.split(":")[0]*60000 + document.getElementById("tripTimeText").innerText.split(":")[1]*1000);
      isTracking = true;
      initPassiveGps();
      
      document.getElementById("gpsStatusBadge").innerText = "Kayıt 🔴";
      document.getElementById("gpsStatusBadge").classList.add("animate-pulse");
      timerInterval = setInterval(() => {
        const sec = Math.floor((Date.now() - startTime) / 1000);
        const m = String(Math.floor(sec / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        document.getElementById("tripTimeText").innerText = `${m}:${s}`;
      }, 1000);
    }

    function finalizeRouteSave() {
      const rName = document.getElementById("modalRouteName").value.trim() || "Belirtilmedi";
      const finalKm = parseFloat(document.getElementById("modalDistance").value) || parseFloat(totalDistanceKm.toFixed(1));
      const finalCons = parseFloat(document.getElementById("modalConsumption").value) || avgConsumption;
      
      const finalLiters = parseFloat(((finalKm * finalCons) / 100).toFixed(2));
      const finalCost = Math.round(finalLiters * unitFuelPrice);

      const newRoute = {
        id: "route_" + Date.now(),
        name: rName,
        date: new Date().toISOString(),
        distance: finalKm,
        consumption: finalCons.toFixed(2),
        liters: finalLiters
      };

      try {
        let routes = [];
        const raw = localStorage.getItem(STORAGE_PREFIX + "completed_routes");
        if (raw) routes = JSON.parse(raw);
        routes.push(newRoute);
        localStorage.setItem(STORAGE_PREFIX + "completed_routes", JSON.stringify(routes));
      } catch (e) {}

      if (fullBackupData) {
        if (!Array.isArray(fullBackupData.completedRoutes)) fullBackupData.completedRoutes = [];
        fullBackupData.completedRoutes.push(newRoute);
        exportUpdatedZip();
      }

      document.getElementById("finishModal").classList.add("hidden");
      resetDisplay();
      initPassiveGps();
      
      alert(`✅ ROTA KAYDEDİLDİ!\n🧭 ${newRoute.name}\n🛣️ ${finalKm} KM\n💧 ${finalLiters} L (~${finalCost.toLocaleString('tr-TR')} ₺)`);
    }

    async function exportUpdatedZip() {
      try {
        const zip = new JSZip();
        zip.file("veriler.json", JSON.stringify(fullBackupData, null, 2));
        const blob = await zip.generateAsync({ type: "blob" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `Carveri_Yedek_${new Date().toISOString().split("T")[0]}.zip`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      } catch (e) {}
    }

    window.addEventListener("DOMContentLoaded", () => {
      initTheme();
      syncFromCarveriStorage(); 
      initPassiveGps();
    });
  </script>
</body>
</html>
